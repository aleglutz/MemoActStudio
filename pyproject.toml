# Packaging metadata for the ComfyUI Registry (SPEC §9.8, P3).
#
# It carries no build backend on purpose: this is not a wheel, it is a folder
# that ComfyUI loads from custom_nodes/. The Registry and ComfyUI-Manager read
# this file to install and update the pack; nothing else does.

[project]
name = "memoactstudio"
version = "0.2.0"
description = "Cut a vertical reel to a voice-over. The script is ground truth; alignment computes timing only, so captions are never transcribed."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
# torch, numpy and Pillow come with ComfyUI and are deliberately not pinned --
# see docs/WORKSHOP_MACHINE_SETUP.md, where reinstalling torch is called out as
# something that can break the ComfyUI install itself. ffmpeg is an external
# binary and must be built with libass.
dependencies = ["stable-ts>=2.17", "num2words>=0.5.13"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]

[project.urls]
Repository = "https://github.com/aleglutz/MemoActStudio"

[tool.comfy]
PublisherId = "aleglutz"
DisplayName = "MemoActStudio"
Icon = ""
